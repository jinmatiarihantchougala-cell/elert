<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Silent SOS</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="auth-wrap"><form class="auth-card" id="loginForm"><div class="brand brand-center"><span class="brand-mark">SOS</span></div><h1 style="text-align:center">Welcome back</h1><p class="tagline">Sign in to your safety dashboard</p><div class="form-grid"><fieldset class="account-choice"><legend>I am signing in as</legend><label><input type="radio" name="accountType" value="user" checked> User (I need help)</label><label><input type="radio" name="accountType" value="police"> Police (I help others)</label></fieldset><div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary full" type="submit">Sign in securely</button></div><p style="text-align:center"><a class="muted" href="register.html">Create a new account</a></p><p style="text-align:center"><a class="muted" href="login.html?admin=1">Administrator sign in</a></p></form></main><script src="js/api.js"></script><script src="js/auth.js"></script></body></html>
