<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | Silent SOS</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="auth-wrap"><form class="auth-card" id="registerForm"><div class="brand brand-center"><span class="brand-mark">SOS</span></div><h1 style="text-align:center">Protect yourself</h1><p class="tagline">Create your Silent SOS account</p><div class="form-grid"><fieldset class="account-choice"><legend>Create account as</legend><label><input type="radio" name="accountType" value="user" checked> User (I need help)</label><label><input type="radio" name="accountType" value="police"> Police (I help others)</label></fieldset><div class="field"><label>Full name</label><input name="name" autocomplete="name" maxlength="100" required></div><div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>Phone</label><input name="phone" type="tel" autocomplete="tel"></div><div class="field"><label>Password</label><input name="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label>Confirm password</label><input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn btn-primary full" type="submit">Create account</button></div><p class="muted account-note">Police accounts can view emergency alerts across all users.</p><p style="text-align:center"><a class="muted" href="login.html">Already have an account? Sign in</a></p></form></main><script src="js/api.js"></script><script src="js/auth.js"></script></body></html>
