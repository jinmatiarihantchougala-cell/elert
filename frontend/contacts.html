<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contacts | Silent SOS</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">SOS</span><span class="brand-name">SILENT SOS</span></a><nav class="nav-links"><a href="dashboard.html">Dashboard</a><a class="active" href="contacts.html">Contacts</a><a href="alerts.html">History</a><button id="logoutBtn">Logout</button></nav></header><main class="shell"><div class="card-header"><div><p class="muted" style="margin:0 0 4px">Trusted people</p><h1 style="margin:0">Emergency contacts</h1></div><button class="btn btn-primary" id="addContactBtn">Add contact</button></div><section class="card"><div class="table-wrap" id="contactsList"><p class="muted">Loading contacts...</p></div></section></main>
<div class="modal-backdrop hidden" id="contactModal"><form class="modal" id="contactForm"><div class="card-header"><h2 id="modalTitle">Add contact</h2><button type="button" class="icon-btn" id="closeModal" aria-label="Close">×</button></div><div class="form-grid"><div class="field"><label>Name</label><input name="name" required maxlength="100"></div><div class="field"><label>Relationship</label><input name="relationship" maxlength="50" placeholder="Family, friend, colleague"></div><div class="field"><label>Phone</label><input name="phone" type="tel" maxlength="30"></div><div class="field"><label>Email</label><input name="email" type="email"></div><p class="muted account-note">We’ll send a verification code to each contact method you enter. Only verified methods receive SOS notifications. Email/SMS delivery requires SMTP/Twilio setup.</p></div><div class="actions"><button type="button" class="btn btn-ghost" id="cancelModal">Cancel</button><button class="btn btn-primary" type="submit">Save contact</button></div></form></div>
<script src="js/api.js"></script><script src="js/contacts.js"></script></body></html>
